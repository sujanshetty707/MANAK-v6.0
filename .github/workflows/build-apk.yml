name: Build Android APK

on:
  push:
    branches: [ main, master, Sujan-Manak ]
  pull_request:
    branches: [ main, master, Sujan-Manak ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://manak-backend.onrender.com' }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MANAK-Compliance.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MANAK-Compliance-apk
          path: android/app/build/outputs/apk/debug/MANAK-Compliance.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Sujan-Manak')

        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "MANAK Compliance App v1.0.0"
          body: |
            ### Automated Build - MANAK Compliance Android App
            Direct standalone APK ready to install on Android devices.
            - **Direct APK download** (no zip extraction needed).
          files: android/app/build/outputs/apk/debug/MANAK-Compliance.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
